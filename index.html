<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة كيف تتحرك الأشياء؟</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo for child-friendly Arabic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            user-select: none;
            overflow: hidden; /* Prevent all scrolling */
            position: fixed;
            width: 100vw;
            height: 100vh;
        }

        /* Floating clouds animation */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-6px) translateX(10px); }
        }
        .cloud-float {
            animation: floatSlow 6s ease-in-out infinite;
        }

        /* Bounce animation for main character/item */
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .item-bounce {
            animation: gentleBounce 2.5s infinite ease-in-out;
        }

        /* Shake animation for wrong answer */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px) rotate(-3deg); }
            40%, 80% { transform: translateX(8px) rotate(3deg); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }

        /* Pop animation for correct answer */
        @keyframes popSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.12) rotate(2deg); }
            100% { transform: scale(1.03); }
        }
        .pop-anim {
            animation: popSuccess 0.35s forwards ease-out;
        }

        /* 3D Toy Button Feel */
        .toy-btn {
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.18);
        }
        .toy-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.18);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-300 via-sky-200 to-emerald-200 w-screen h-screen flex flex-col justify-between items-center p-2 sm:p-4">

    <!-- Confetti Canvas for Celebrations -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Decorative Background Elements (Sun & Clouds) -->
    <div class="absolute top-3 left-4 text-4xl sm:text-6xl opacity-90 pointer-events-none select-none animate-pulse">☀️</div>
    <div class="absolute top-4 right-6 text-4xl sm:text-6xl opacity-80 pointer-events-none select-none cloud-float">☁️</div>

    <!-- Top Header & Score Bar (Compact & Fixed Height) -->
    <header class="w-full max-w-2xl mx-auto z-10 shrink-0">
        <div class="bg-white/90 backdrop-blur-md rounded-2xl p-2 sm:p-3 shadow-md border-3 border-yellow-400 flex items-center justify-between">
            <!-- Game Title -->
            <div class="flex items-center gap-1.5">
                <span class="text-2xl sm:text-3xl">🎈</span>
                <h1 class="text-base sm:text-2xl font-black text-pink-600 tracking-wide">كيف تتحرك الأشياء؟</h1>
            </div>

            <!-- Score & Audio Controls -->
            <div class="flex items-center gap-2">
                <div class="bg-yellow-100 border-2 border-yellow-400 rounded-xl px-3 py-0.5 flex items-center gap-1.5 shadow-inner">
                    <span class="text-xl sm:text-2xl">⭐</span>
                    <span class="text-base sm:text-xl font-black text-amber-600" id="score-display">0</span>
                </div>
                <button id="sound-toggle" onclick="toggleSound()" class="bg-purple-500 hover:bg-purple-600 text-white text-lg sm:text-xl p-2 rounded-xl toy-btn border-2 border-purple-700" title="تشغيل/إيقاف الصوت">
                    🔊
                </button>
            </div>
        </div>
    </header>

    <!-- Main Game Container (Fully Fitted, No Scroll) -->
    <main class="w-full max-w-2xl flex-grow flex items-center justify-center my-1 z-10">
        <div class="w-full h-full max-h-[520px] bg-white/95 backdrop-blur rounded-[2rem] shadow-xl border-4 border-white p-3 sm:p-5 flex flex-col justify-between items-center relative overflow-hidden">

            <!-- Item Selector Tabs (Quick Navigation for Kids) -->
            <div class="w-full flex justify-center gap-1.5 sm:gap-2 shrink-0" id="level-tabs">
                <!-- Dynamically populated tabs -->
            </div>

            <!-- Stage Display Card -->
            <div id="stage-card" class="w-full bg-gradient-to-b from-amber-50 to-orange-100 rounded-2xl border-3 border-orange-300 p-2 sm:p-4 flex flex-col items-center justify-center shadow-inner shrink-0">
                
                <!-- Question Badge -->
                <div id="question-badge" class="bg-white/90 px-4 py-1 rounded-full border-2 border-orange-300 text-orange-700 font-extrabold text-sm sm:text-lg mb-1 shadow-sm text-center">
                    كيف تتحرك الكرة؟
                </div>

                <!-- Giant 2D Cartoon Graphic / Emoji -->
                <div id="item-graphic" class="text-6xl sm:text-8xl my-1 item-bounce select-none filter drop-shadow-md">
                    ⚽
                </div>

                <!-- Item Title -->
                <h2 id="item-title" class="text-lg sm:text-2xl font-black text-slate-800">
                    الكرة
                </h2>
            </div>

            <!-- Feedback Message Area -->
            <div id="feedback-box" class="h-8 flex items-center justify-center text-center shrink-0">
                <p id="feedback-text" class="text-sm sm:text-xl font-black text-sky-700">
                    اضغط على الإجابة الصحيحة بالأسفل 👇
                </p>
            </div>

            <!-- Options Grid (Strictly 2 Options) -->
            <div id="options-grid" class="w-full grid grid-cols-2 gap-2 sm:gap-3 shrink-0">
                <!-- Dynamically populated option buttons -->
            </div>

            <!-- Next Item Button (Appears when level is solved) -->
            <button id="next-btn" onclick="nextLevel()" class="hidden w-full bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white font-black text-lg sm:text-xl py-3 px-6 rounded-2xl toy-btn border-3 border-white shadow-lg flex items-center justify-center gap-2 animate-bounce shrink-0">
                <span>العنصر التالي</span>
                <span class="text-xl">⬅️</span>
            </button>

        </div>
    </main>

    <!-- Final Celebration Modal (Hidden by default) -->
    <div id="victory-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] border-6 border-yellow-400 p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl flex flex-col items-center animate-bounce">
            <div class="text-6xl sm:text-7xl mb-3">🏆🎉</div>
            <h2 class="text-2xl sm:text-3xl font-black text-pink-600 mb-1">بطل رائع!</h2>
            <p class="text-sm sm:text-base font-bold text-slate-600 mb-4">
                لقد تعرفت على جميع الأشياء وكيف تتحرك بنجاح!
            </p>
            <div class="bg-yellow-100 border-3 border-yellow-400 rounded-xl px-5 py-2 mb-4 flex items-center gap-2">
                <span class="text-3xl">⭐</span>
                <span class="text-xl sm:text-2xl font-black text-amber-600" id="final-score">0</span>
                <span class="text-sm font-bold text-amber-700">نقطة</span>
            </div>
            <button onclick="restartGame()" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-black text-lg sm:text-xl py-3 px-6 rounded-2xl toy-btn border-3 border-pink-300">
                العب مرة أخرى 🔄
            </button>
        </div>
    </div>

    <!-- Bottom Decorative Grass Floor -->
    <footer class="w-full h-6 bg-emerald-400 border-t-2 border-emerald-500 shrink-0 flex items-center justify-around overflow-hidden text-lg select-none pointer-events-none">
        <span>🌷</span><span>🌱</span><span>🌻</span><span>🌱</span><span>🌼</span><span>🌱</span><span>🌷</span>
    </footer>

    <script>
        /* ==========================================
           GAME DATA (Updated: No "what is it", 2 choices only)
           ========================================== */
        const levels = [
            {
                id: 'ball',
                name: 'الكرة',
                emoji: '⚽',
                bgGradient: 'from-amber-50 to-orange-100',
                borderColor: 'border-orange-300',
                question: 'كيف تتحرك الكرة؟',
                options: [
                    { text: 'تتحرك بالركل', icon: '👟', isCorrect: true },
                    { text: 'تتحرك بالركض', icon: '🏃', isCorrect: false }
                ]
            },
            {
                id: 'car',
                name: 'السيارة',
                emoji: '🚗',
                bgGradient: 'from-rose-50 to-red-100',
                borderColor: 'border-red-300',
                question: 'كيف تتحرك السيارة؟',
                options: [
                    { text: 'تتحرك بمحرك', icon: '⚙️', isCorrect: true },
                    { text: 'يتحرك ولد', icon: '👦', isCorrect: false }
                ]
            },
            {
                id: 'bird',
                name: 'الطائر',
                emoji: '🐦',
                bgGradient: 'from-sky-50 to-blue-100',
                borderColor: 'border-sky-300',
                question: 'كيف يتحرك الطائر؟',
                options: [
                    { text: 'يطير بالأجنحة', icon: '🪽', isCorrect: true },
                    { text: 'تتحرك بالركل', icon: '👟', isCorrect: false }
                ]
            },
            {
                id: 'boy',
                name: 'الولد',
                emoji: '👦',
                bgGradient: 'from-emerald-50 to-green-100',
                borderColor: 'border-emerald-300',
                question: 'كيف يتحرك الولد؟',
                options: [
                    { text: 'يركض ويمشي', icon: '🏃‍♂️', isCorrect: true },
                    { text: 'تتحرك بمحرك', icon: '⚙️', isCorrect: false }
                ]
            }
        ];

        // Cheerful Button Color Palettes for Kids
        const buttonColors = [
            'bg-pink-500 hover:bg-pink-400 border-pink-700 text-white',
            'bg-sky-500 hover:bg-sky-400 border-sky-700 text-white'
        ];

        // State Variables
        let currentLevelIndex = 0;
        let score = 0;
        let soundEnabled = true;
        let completedLevels = new Set();

        /* ==========================================
           WEB AUDIO SYNTHESIZER (Kid Sound Effects)
           ========================================== */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.25, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.35);
                    });
                } else if (type === 'wrong') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(130, now + 0.25);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 659.25, 1046.50];
                    const times = [0, 0.12, 0.24, 0.36, 0.5];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + times[idx]);
                        gain.gain.setValueAtTime(0.3, now + times[idx]);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + times[idx] + 0.4);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + times[idx]);
                        osc.stop(now + times[idx] + 0.4);
                    });
                }
            } catch (e) {
                console.warn('Audio playback prevented:', e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-toggle');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
        }

        /* ==========================================
           GAME LOGIC & UI RENDERING
           ========================================== */
        function renderTabs() {
            const tabsContainer = document.getElementById('level-tabs');
            tabsContainer.innerHTML = '';

            levels.forEach((lvl, idx) => {
                const isCurrent = idx === currentLevelIndex;
                const isDone = completedLevels.has(idx);

                const btn = document.createElement('button');
                btn.onclick = () => selectLevel(idx);
                btn.className = `flex items-center gap-1 px-3 py-1.5 rounded-xl font-black text-xs sm:text-base transition-all toy-btn border-2 ${
                    isCurrent 
                        ? 'bg-yellow-400 border-yellow-600 text-slate-900 scale-105' 
                        : isDone 
                            ? 'bg-emerald-100 border-emerald-400 text-emerald-800' 
                            : 'bg-slate-100 border-slate-300 text-slate-600 hover:bg-slate-200'
                }`;

                btn.innerHTML = `
                    <span class="text-lg sm:text-xl">${lvl.emoji}</span>
                    <span class="hidden sm:inline">${lvl.name}</span>
                    ${isDone ? '<span class="text-xs">✅</span>' : ''}
                `;
                tabsContainer.appendChild(btn);
            });
        }

        function loadLevel(index) {
            currentLevelIndex = index;
            const lvl = levels[index];

            // Update Tabs
            renderTabs();

            // Update Main Graphic & Text
            const graphic = document.getElementById('item-graphic');
            graphic.textContent = lvl.emoji;
            graphic.className = 'text-6xl sm:text-8xl my-1 item-bounce select-none filter drop-shadow-md';

            document.getElementById('item-title').textContent = lvl.name;
            document.getElementById('question-badge').textContent = lvl.question;

            // Reset Feedback & Next Button
            const feedbackText = document.getElementById('feedback-text');
            feedbackText.textContent = 'اضغط على الإجابة الصحيحة بالأسفل 👇';
            feedbackText.className = 'text-sm sm:text-xl font-black text-sky-700';

            document.getElementById('next-btn').classList.add('hidden');

            // Render Option Buttons (Always 2)
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';

            lvl.options.forEach((opt, idx) => {
                const colorClass = buttonColors[idx % buttonColors.length];
                const btn = document.createElement('button');
                btn.className = `${colorClass} toy-btn border-3 rounded-2xl p-3 sm:p-4 flex items-center justify-between text-base sm:text-xl font-black w-full`;
                btn.dataset.answered = 'false';

                btn.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-2xl sm:text-3xl bg-white/25 p-1.5 rounded-xl">${opt.icon}</span>
                        <span>${opt.text}</span>
                    </div>
                    <span class="status-icon text-xl"></span>
                `;

                btn.onclick = () => handleOptionClick(btn, opt);
                grid.appendChild(btn);
            });
        }

        function handleOptionClick(btn, option) {
            if (btn.dataset.answered === 'true') return;

            const feedbackText = document.getElementById('feedback-text');
            const graphic = document.getElementById('item-graphic');
            const statusIcon = btn.querySelector('.status-icon');

            if (option.isCorrect) {
                btn.dataset.answered = 'true';
                score += 10;
                document.getElementById('score-display').textContent = score;

                // Visual Success Styling on Button
                btn.className = 'bg-emerald-500 border-emerald-700 text-white toy-btn border-3 rounded-2xl p-3 sm:p-4 flex items-center justify-between text-base sm:text-xl font-black w-full pop-anim cursor-default';
                statusIcon.textContent = '✅';

                playSound('correct');

                // Level Complete!
                completedLevels.add(currentLevelIndex);
                renderTabs();
                triggerConfetti();

                feedbackText.textContent = 'إجابة ممتازة يا بطل! 🎉👏';
                feedbackText.className = 'text-base sm:text-2xl font-black text-emerald-600 animate-bounce';

                // Disable remaining button
                const allBtns = document.getElementById('options-grid').querySelectorAll('button');
                allBtns.forEach(b => {
                    if (b.dataset.answered !== 'true') {
                        b.classList.add('opacity-50', 'pointer-events-none');
                    }
                });

                // Show Next button or Final Modal
                if (completedLevels.size === levels.length) {
                    setTimeout(() => {
                        playSound('win');
                        showVictoryModal();
                    }, 900);
                } else {
                    document.getElementById('next-btn').classList.remove('hidden');
                }

            } else {
                // Wrong Answer Feedback
                btn.dataset.answered = 'true';
                btn.className = 'bg-slate-300 border-slate-400 text-slate-600 border-3 rounded-2xl p-3 sm:p-4 flex items-center justify-between text-base sm:text-xl font-black w-full shake-anim opacity-75 cursor-not-allowed';
                statusIcon.textContent = '❌';

                graphic.classList.remove('item-bounce');
                void graphic.offsetWidth;
                graphic.classList.add('shake-anim');
                setTimeout(() => {
                    graphic.classList.remove('shake-anim');
                    graphic.classList.add('item-bounce');
                }, 400);

                playSound('wrong');
                feedbackText.textContent = 'حاول مرة أخرى يا بطل! 💪😊';
                feedbackText.className = 'text-sm sm:text-xl font-black text-rose-600';
            }
        }

        function selectLevel(idx) {
            loadLevel(idx);
        }

        function nextLevel() {
            const nextIdx = (currentLevelIndex + 1) % levels.length;
            loadLevel(nextIdx);
        }

        function showVictoryModal() {
            document.getElementById('final-score').textContent = score;
            const modal = document.getElementById('victory-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            triggerConfetti();
        }

        function restartGame() {
            score = 0;
            completedLevels.clear();
            document.getElementById('score-display').textContent = '0';
            const modal = document.getElementById('victory-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            loadLevel(0);
        }

        /* ==========================================
           CONFETTI CELEBRATION SYSTEM
           ========================================== */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfetti() {
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ec4899'];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.8) * 15,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    life: 80
                });
            }
            if (!animId) {
                updateConfetti();
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.4;
                p.rotation += p.vRot;
                p.life -= 1.2;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            });

            particles = particles.filter(p => p.life > 0);

            if (particles.length > 0) {
                animId = requestAnimationFrame(updateConfetti);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                animId = null;
            }
        }

        // Start game on load
        window.onload = function() {
            loadLevel(0);
        };
    </script>
</body>
</html>
